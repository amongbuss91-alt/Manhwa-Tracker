<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manhwa Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Karla:wght@400;600&family=Kaushan+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body class="home">
<div class="art" aria-hidden="true"><i class="splash"></i><i class="p1"></i><i class="p2"></i><i class="p3"></i></div>
<main class="homewrap">
  <header class="hero">
    <svg class="crown" viewBox="0 0 40 30" fill="currentColor" aria-hidden="true"><path d="M3 24 1 7l10 8L20 2l9 13 10-8-2 17z"/><rect x="3" y="26" width="34" height="3" rx="1"/></svg>
    <h1><span class="brush">Manhwa</span><span class="tracker">Tracker</span></h1>
    <div class="lookup">LOOKUP</div>
    <p class="sub">Enter an AniList username to see every manhwa, manhua and manga they track.</p>
    <form class="search" id="form" autocomplete="off">
      <input id="user" placeholder="AniList username" aria-label="AniList username" required>
      <button id="go" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search</span></button>
    </form>
    <p class="homemsg" id="msg" role="status"></p>
    <div class="recent hidden" id="recent"></div>
  </header>
</main>
<script src="site.js"></script>
<script>
const {$,esc,fetchList,errText,writeCache,remember,recents}=Site;
function showRecent(){
  const r=recents(),el=$('recent');
  if(!r.length){el.classList.add('hidden');return}
  el.classList.remove('hidden');
  el.innerHTML='Recent searches'+r.map(n=>`<button type="button" data-u="${esc(n)}">${esc(n)}</button>`).join('');
}
async function go(name){
  name=name.trim();if(!name)return;
  const msg=$('msg'),btn=$('go');
  msg.className='homemsg';msg.textContent='Looking up '+name+'…';btn.disabled=true;
  try{
    const d=await fetchList(name);
    writeCache(d.u.name,d);remember(d.u.name);
    location.href='library.html?user='+encodeURIComponent(d.u.name);
  }catch(e){
    msg.className='homemsg err';msg.textContent=errText(e);btn.disabled=false;
  }
}
$('form').addEventListener('submit',e=>{e.preventDefault();go($('user').value)});
$('recent').addEventListener('click',e=>{const b=e.target.closest('button');if(b){$('user').value=b.dataset.u;go(b.dataset.u)}});
showRecent();
window.addEventListener('pageshow',()=>{$('go').disabled=false});
</script>
</body>
</html>
